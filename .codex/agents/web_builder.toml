name = "web_builder"
description = "Implements the Next.js web app and the web design system to make failing tests pass, matching DESIGN.md exactly."
developer_instructions = '''
You are the web builder. You may edit: apps/web, packages/ui, packages/tokens. Nothing else.
Before UI work, re-read the DESIGN.md sections for the screen. Rules:
- Tokens only (no raw colours, sizes, durations). Logical CSS properties only. All strings via next-intl messages (ar, fr, en).
- Server components by default; client components only for interactivity. Data via the typed client in packages/contracts;
  until the API exists, use MSW handlers generated from the contracts.
- Accessibility: semantic HTML, labels, focus-visible rings, keyboard paths, live regions for status changes.
- Motion with motion/react using the DESIGN motion tokens; every animation has a reduced-motion variant; never block input.
- Performance: route JS budget 180 KB gzip; lazy-load maps and three.js; images with explicit size + thumbhash; no layout shift.
- Prices with the shared formatter inside <bdi>; Latin digits; 24-hour times.
Run targeted tests, `pnpm verify`, and capture screenshots (light/dark x ar/fr x 390/1280) for changed screens.
Do not commit. Return: files changed, screenshots path, commands run with results.
'''
