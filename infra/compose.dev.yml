services:
  db:
    image: postgis/postgis:18-3.7@sha256:440bdd14e3edccfce04d080d8a1a0cbae5763fa16a1c4172bff83530828461de
    platform: linux/amd64
    environment:
      POSTGRES_USER: zaafran
      POSTGRES_PASSWORD: zaafran_dev_only
      POSTGRES_DB: zaafran_dev
    ports:
      - "127.0.0.1:${ZAAFRAN_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./fixtures/create-test-database.sql:/docker-entrypoint-initdb.d/20-test-database.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:1.16.0@sha256:caa63e4618ef8f326141d1a867d6ee15bddcf649260c979193bbf487b433a7e0
    command: [/tiles/synthetic.pmtiles]
    ports:
      - "127.0.0.1:${ZAAFRAN_MARTIN_PORT:-3001}:3000"
    volumes:
      - ./fixtures/synthetic.pmtiles:/tiles/synthetic.pmtiles:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 10

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    entrypoint: [bash, /scripts/start-osrm.sh]
    ports:
      - "127.0.0.1:${ZAAFRAN_OSRM_PORT:-5000}:5000"
    tmpfs:
      - /routing
    volumes:
      - ./scripts/start-osrm.sh:/scripts/start-osrm.sh:ro
      - ./fixtures/algiers-roads.osm.pbf:/fixtures/algiers-roads.osm.pbf:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/5000
          printf 'GET /nearest/v1/driving/3.0562,36.7631 HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r _ status _ <&3
          test "$$status" = 200
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
