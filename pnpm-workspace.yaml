packages:
  - apps/*
  - packages/*

overrides:
  "graphile-config>@types/node": 26.6.6
  "glob@>=9 <14.0.6": 14.0.6
  "minimatch@>=7 <11.0.8": 11.0.8
  "typed-rest-client>qs@6.15.1": 6.16.1

# Mahdi's decision (18 November 2026): one advisory, no patched release, reached only by build and
# test tooling. Reasoning and re-check steps: docs/SECURITY_REVIEW.md. Every other advisory still
# fails `pnpm audit`.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade

minimumReleaseAgeExclude:
  - knip@6.44.2
  - "@tailwindcss/node@4.3.5"
  - "@tailwindcss/oxide-android-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-x64@4.3.5"
  - "@tailwindcss/oxide-freebsd-x64@4.3.5"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.5"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.5"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.5"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.5"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.5"
  - "@tailwindcss/oxide@4.3.5"
  - "@tailwindcss/postcss@4.3.5"
  - tailwindcss@4.3.5

storeDir: .pnpm-store

# Supported platforms use the lockfile's prebuilt optional native packages.
allowBuilds:
  "@parcel/watcher@2.6.0": false
  "@swc/core@1.16.22": false
  "esbuild@0.28.2": false
